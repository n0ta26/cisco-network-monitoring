name: Ansible CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  syntax-check:
    name: Ansible syntax check
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and lint tooling
        run: python -m pip install -r ansible/requirements.txt

      - name: Install Ansible collections
        run: >-
          ansible-galaxy collection install
          --force
          -r ansible/requirements.yml

      - name: Show pinned toolchain versions
        run: |
          ansible --version
          ansible-lint --version
          ansible-galaxy collection list community.docker

      - name: Run ansible-lint
        run: ansible-lint --profile production ansible

      - name: Run syntax check
        working-directory: ansible
        run: ansible-playbook -i inventory.yml playbooks/deploy-monitoring.yml --syntax-check

      - name: Validate default monitoring configuration
        run: ./scripts/validate-monitoring-config.sh

      - name: Validate multiple monitoring targets
        run: >-
          ./scripts/validate-monitoring-config.sh
          -e @ansible/tests/fixtures/multiple-monitoring-targets.yml
