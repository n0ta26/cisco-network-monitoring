---
- name: Render monitoring configuration for validation
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - "{{ playbook_dir }}/../roles/monitoring_stack/defaults/main.yml"

  pre_tasks:
    - name: Validate configuration output directory
      ansible.builtin.assert:
        that:
          - monitoring_config_output_dir is defined
          - monitoring_config_output_dir | length > 1
          - monitoring_config_output_dir is ansible.builtin.match('^/')
        fail_msg: >-
          Pass an absolute monitoring_config_output_dir outside the repository.

    - name: Validate monitoring alert settings
      ansible.builtin.include_tasks: >-
        {{ playbook_dir }}/../roles/monitoring_stack/tasks/validate.yml

  tasks:
    - name: Ensure rendered configuration directories exist
      ansible.builtin.file:
        path: "{{ monitoring_config_output_dir }}/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - alertmanager
        - prometheus/rules

    - name: Render configuration files
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ monitoring_config_output_dir }}/{{ item.dest }}"
        mode: "{{ item.mode }}"
      loop:
        - src: >-
            {{ playbook_dir }}/../roles/monitoring_stack/templates/alertmanager.yml.j2
          dest: alertmanager/alertmanager.yml
          mode: "0600"
        - src: >-
            {{ playbook_dir }}/../roles/monitoring_stack/templates/prometheus.yml.j2
          dest: prometheus/prometheus.yml
          mode: "0644"
        - src: >-
            {{ playbook_dir }}/../roles/monitoring_stack/templates/prometheus-alerts.yml.j2
          dest: prometheus/rules/cisco-router-alerts.yml
          mode: "0644"

    - name: Read rendered Prometheus configuration
      ansible.builtin.slurp:
        src: "{{ monitoring_config_output_dir }}/prometheus/prometheus.yml"
      register: rendered_prometheus_configuration

    - name: Validate rendered Prometheus target count
      vars:
        rendered_prometheus_data: >-
          {{
            rendered_prometheus_configuration.content
            | b64decode
            | from_yaml
          }}
        expected_monitoring_components:
          - alertmanager
          - grafana
          - node-exporter
          - prometheus
          - snmp-exporter
        rendered_monitoring_stack_scrape_configs: >-
          {{
            rendered_prometheus_data.scrape_configs
            | selectattr('job_name', 'equalto', 'monitoring-stack')
            | list
          }}
        rendered_monitoring_components: >-
          {{
            rendered_monitoring_stack_scrape_configs[0].static_configs
            | map(attribute='labels')
            | map(attribute='component')
            | list
            | sort
          }}
        expected_target_module_pairs: >-
          {{
            monitoring_stack_targets
            | map(attribute='modules')
            | map('length')
            | sum
          }}
        rendered_snmp_scrape_configs: >-
          {{
            rendered_prometheus_data.scrape_configs
            | selectattr(
                'job_name',
                'in',
                monitoring_stack_snmp_module_jobs
                | map(attribute='job_name')
                | list
              )
            | list
          }}
        rendered_target_module_pairs: >-
          {{
            rendered_snmp_scrape_configs
            | map(attribute='static_configs')
            | map('length')
            | sum
          }}
      ansible.builtin.assert:
        that:
          - rendered_monitoring_stack_scrape_configs | length == 1
          - rendered_monitoring_components == expected_monitoring_components
          - rendered_target_module_pairs == expected_target_module_pairs
        fail_msg: >-
          Rendered Prometheus configuration must contain every monitoring stack
          component and every requested SNMP target and module combination.
