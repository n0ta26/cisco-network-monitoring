---
monitoring_stack_app_dir: /opt/network-monitoring
monitoring_stack_source_dir: "{{ playbook_dir }}/../../files"
monitoring_stack_docker_cli_path: /usr/bin/docker
monitoring_stack_file_mode: "0644"
monitoring_stack_secret_file_mode: "0600"
monitoring_stack_dir_mode: "0755"
monitoring_stack_alertmanager_config_owner: "65534"
monitoring_stack_alertmanager_config_group: "65534"

# SNMP targets are rendered into Prometheus scrape configuration. Each module
# keeps its own scrape job so a failing device-specific module does not block
# interface polling.
monitoring_stack_snmp_module_jobs:
  - module: if_mib
    job_name: cisco-router-snmp
  - module: cisco_device
    job_name: cisco-router-device

# This default preserves the original single-router deployment. Override the
# entire list in group_vars to add, update, or remove monitored devices.
monitoring_stack_targets:
  - name: cisco-router
    address: 172.16.2.1
    role: home-router
    auth_profile: cisco_v3
    modules:
      - if_mib
      - cisco_device
    labels: {}

# Alertmanager routing. Leave the webhook URL empty to keep alerts visible only
# in Prometheus and Alertmanager without sending external notifications.
monitoring_stack_alertmanager_webhook_url: ""
monitoring_stack_alertmanager_webhook_send_resolved: true
monitoring_stack_alertmanager_resolve_timeout: 5m
monitoring_stack_alertmanager_group_wait: 30s
monitoring_stack_alertmanager_group_interval: 5m
monitoring_stack_alertmanager_repeat_interval: 4h

# Monitoring stack self-observability thresholds.
monitoring_stack_alert_prometheus_data_free_percent: 15
monitoring_stack_alert_host_cpu_utilization_percent: 90
monitoring_stack_alert_host_memory_utilization_percent: 90
monitoring_stack_alert_host_cpu_rate_window: 5m

# Monitoring stack self-observability pending durations.
monitoring_stack_alert_component_down_for: 2m
monitoring_stack_alert_config_reload_failed_for: 5m
monitoring_stack_alert_prometheus_data_low_for: 10m
monitoring_stack_alert_prometheus_data_metrics_missing_for: 5m
monitoring_stack_alert_host_cpu_high_for: 10m
monitoring_stack_alert_host_memory_high_for: 10m

# Monitoring stack self-observability severity labels.
monitoring_stack_alert_component_down_severity: critical
monitoring_stack_alert_config_reload_failed_severity: critical
monitoring_stack_alert_prometheus_data_low_severity: critical
monitoring_stack_alert_prometheus_data_metrics_missing_severity: critical
monitoring_stack_alert_host_cpu_high_severity: warning
monitoring_stack_alert_host_memory_high_severity: warning

# Alert evaluation window and thresholds.
monitoring_stack_alert_rate_window: 5m
monitoring_stack_alert_bandwidth_utilization_percent: 85
monitoring_stack_alert_interface_error_rate: 1
monitoring_stack_alert_interface_discard_rate: 1
monitoring_stack_alert_cpu_utilization_percent: 85
monitoring_stack_alert_memory_utilization_percent: 90
monitoring_stack_alert_temperature_celsius: 70

# Alert pending durations suppress short-lived failures and metric spikes.
monitoring_stack_alert_snmp_down_for: 2m
monitoring_stack_alert_interface_down_for: 5m
monitoring_stack_alert_bandwidth_high_for: 10m
monitoring_stack_alert_interface_error_for: 5m
monitoring_stack_alert_interface_discard_for: 5m
monitoring_stack_alert_cpu_high_for: 10m
monitoring_stack_alert_memory_high_for: 10m
monitoring_stack_alert_temperature_high_for: 10m

# Severity labels can be aligned with the notification receiver's conventions.
monitoring_stack_alert_snmp_down_severity: critical
monitoring_stack_alert_interface_down_severity: critical
monitoring_stack_alert_bandwidth_high_severity: warning
monitoring_stack_alert_interface_error_severity: warning
monitoring_stack_alert_interface_discard_severity: warning
monitoring_stack_alert_cpu_high_severity: warning
monitoring_stack_alert_memory_high_severity: warning
monitoring_stack_alert_temperature_high_severity: critical
